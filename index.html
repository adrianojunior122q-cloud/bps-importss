<style id="bps-style">/* Layout: loja de moda em preto, branco e bege. Cabeçalho e faixas "ink" sempre escuros; o medalhão do tubarão é o ponto forte da abertura. */
:root{
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#E7E0D3; --fg:#111112; --muted:#66625A; --line:#D8D1C2;
  --btn-bg:#111112; --btn-fg:#F4F2EE; --sand:#D9C8A6; --slate:#45637C; --red:#B3352D; --ok:#2B764A;
  --ink:#0B0B0C; --ink-2:#161618; --on-ink:#F4F2EE; --on-ink-muted:#A9A59C; --ink-line:#2A2A2D;
  --shadow:0 18px 34px -22px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0F; --surface:#171719; --surface-2:#212124; --fg:#F1EEE8; --muted:#A09B91; --line:#2E2E32;
  --btn-bg:#D9C8A6; --btn-fg:#0E0E0F; --slate:#8DB1CC; --red:#E3675F; --ok:#6DBE8C; --shadow:0 18px 34px -22px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0F; --surface:#171719; --surface-2:#212124; --fg:#F1EEE8; --muted:#A09B91; --line:#2E2E32;
  --btn-bg:#D9C8A6; --btn-fg:#0E0E0F; --slate:#8DB1CC; --red:#E3675F; --ok:#6DBE8C; --shadow:0 18px 34px -22px rgba(0,0,0,.9); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);text-transform:uppercase;line-height:.98;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.hdr :focus-visible,.on-ink :focus-visible,.ftr :focus-visible{outline-color:var(--sand)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.7rem 1.25rem;border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:2px;transition:transform .15s,background .15s,color .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
.btn.sand{background:var(--sand);border-color:var(--sand);color:#0B0B0C}
.btn.sand:hover{background:#E8DBBF}
.btn.line-ink{background:transparent;border-color:var(--on-ink-muted);color:var(--on-ink)}
.btn.line-ink:hover{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink)}
.btn.big{min-height:54px;padding:.9rem 1.6rem;font-size:.86rem}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.wa:hover{background:#188a45}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:.4rem .8rem;font-size:.7rem}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn[disabled],.btn.is-disabled{opacity:.4;pointer-events:none}
.link{background:none;border:0;padding:0;font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;color:inherit}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;background:none;border:0;color:inherit;border-radius:50%}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn svg{width:22px;height:22px}
.badge-n{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--sand);color:#0B0B0C;font-size:.68rem;font-weight:800;display:grid;place-items:center}

/* Cabeçalho */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:var(--on-ink);border-bottom:1px solid var(--ink-line)}
.hdr-in{display:flex;align-items:center;gap:1rem;min-height:68px}
.brand{display:flex;align-items:center;gap:.7rem;background:none;border:0;padding:0;color:inherit;text-align:left}
.brand img{width:46px;height:46px;border-radius:50%}
.brand b{font-family:var(--font-display);font-size:1.45rem;letter-spacing:.06em;line-height:1;text-transform:uppercase}
.nav{display:none;gap:.25rem;margin-left:auto}
.nav button{background:none;border:0;padding:.6rem .8rem;color:var(--on-ink-muted);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.nav button:hover{color:var(--on-ink)}
.hdr-tools{display:flex;align-items:center;gap:.15rem;margin-left:auto}
.hdr-cta{display:none;gap:.5rem;margin-left:.5rem}
.menu-btn{display:inline-grid}
.mobile-menu{display:none;border-top:1px solid var(--ink-line);background:var(--ink)}
.mobile-menu.open{display:block}
.mobile-menu .wrap{display:grid;gap:.25rem;padding-block:.75rem 1rem}
.mobile-menu button.m{background:none;border:0;text-align:left;padding:.8rem 0;border-bottom:1px solid var(--ink-line);font-family:var(--font-display);font-size:1.5rem;text-transform:uppercase;color:var(--on-ink)}
.mobile-menu .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
@media(min-width:900px){.nav,.hdr-cta{display:flex}.menu-btn{display:none}.hdr-tools{margin-left:0}.nav{margin-left:auto}.mobile-menu{display:none!important}}

/* Hero */
.on-ink{background:var(--ink);color:var(--on-ink)}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 80% 30%,#1b2530 0%,var(--ink) 60%)}
.hero-in{display:grid;gap:2rem;align-items:center;padding-block:2.5rem 3rem}
.hero-copy{display:grid;gap:1.1rem;justify-items:start;min-width:0}
.hero .eyebrow{color:var(--sand)}
.hero h1{font-size:clamp(3.6rem,15vw,8.2rem);font-weight:900;line-height:.86;letter-spacing:.02em}
.slogan{font-size:clamp(1.2rem,3.6vw,1.7rem);font-weight:600;color:var(--sand)}
.hero-copy .lead{max-width:46ch;color:var(--on-ink-muted);font-size:1.05rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.4rem}
.medal{position:relative;width:min(86vw,440px);aspect-ratio:1;justify-self:center}
.medal img.logo{position:absolute;inset:9.5%;width:81%;height:81%;border-radius:50%;box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 0 2px #2c3a47}
.medal svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 70s linear infinite}
.medal text{font-family:var(--font-display);font-weight:800;font-size:19px;fill:var(--sand);letter-spacing:.2em;text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
.strip{background:var(--sand);color:#0B0B0C;overflow:hidden}
.strip .wrap{display:flex;gap:1.6rem;justify-content:center;flex-wrap:wrap;padding-block:.7rem;font-family:var(--font-display);font-weight:800;font-size:1.15rem;letter-spacing:.14em;text-transform:uppercase}
@media(min-width:900px){.hero-in{grid-template-columns:1.1fr .9fr;padding-block:3.5rem 4.5rem}.medal{justify-self:end}}

/* Seções */
.sec{padding-block:3.2rem}
.sec.alt{background:var(--surface-2)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:.8rem 1.5rem;margin-bottom:1.5rem}
.sec-head h2{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:900}
.sec-head p{color:var(--muted);max-width:52ch;margin-top:.4rem}

/* Carrossel */
.car{position:relative}
.car-track{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:0;padding-bottom:.4rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab}
.car-track::-webkit-scrollbar{display:none}
.car-track.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
.car-track.dragging *{pointer-events:none}
.car-track>*{flex:0 0 min(70vw,260px);scroll-snap-align:start;display:flex}
.car-track>*>.card{flex:1;width:100%}
.car-arrow{position:absolute;top:calc(50% - 60px);z-index:3;width:46px;height:46px;border-radius:50%;border:0;background:var(--btn-bg);color:var(--btn-fg);display:none;place-items:center;box-shadow:var(--shadow);transition:opacity .2s}
.car-arrow svg{width:22px;height:22px}
.car-arrow.prev{left:-14px}.car-arrow.next{right:-14px}
.car:not(.can-prev) .car-arrow.prev,.car:not(.can-next) .car-arrow.next{opacity:0;pointer-events:none}
@media(hover:hover) and (pointer:fine){.car-arrow{display:grid}}
.car-bar{height:3px;background:var(--line);margin-top:.8rem;border-radius:2px;overflow:hidden}
.car-bar i{display:block;height:100%;width:30%;background:var(--fg);border-radius:2px;transition:margin-left .1s}
.car.no-scroll .car-bar{display:none}
.car-hint{margin-top:.5rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.car.no-scroll .car-hint{display:none}

/* Cards de produto */
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden;min-width:0;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.card-img{position:relative;display:block;width:100%;aspect-ratio:4/5;padding:0;border:0;background:var(--surface-2);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.04)}
.badges{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.bd{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;background:var(--ink);color:var(--on-ink);border-radius:1px}
.bd.ex{background:var(--sand);color:#0B0B0C}
.bd.out{background:var(--red);color:#fff}
.card-body{display:flex;flex-direction:column;gap:.45rem;padding:.9rem;flex:1}
.card-body h3{font-size:1.45rem;font-weight:800;line-height:1}
.card-body .price{font-weight:700;font-size:.92rem}
.card-body .price.ask{font-weight:500;color:var(--muted);font-size:.84rem}
.szs{display:flex;flex-wrap:wrap;gap:4px}
.sz{min-width:30px;padding:2px 6px;text-align:center;border:1px solid var(--fg);font-size:.72rem;font-weight:700;border-radius:1px}
.sz.off{border-color:var(--line);color:var(--muted);text-decoration:line-through;opacity:.7}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:auto;padding-top:.5rem}
.card-actions .btn{padding-inline:.4rem;font-size:.68rem;letter-spacing:.06em;min-height:42px}
.card.soldout .card-img img{opacity:.55;filter:grayscale(.6)}
.ph{display:grid;place-items:center;width:100%;height:100%;background:repeating-linear-gradient(135deg,var(--surface-2) 0 14px,color-mix(in srgb,var(--surface-2) 90%,var(--fg)) 14px 15px);position:relative;color:var(--muted)}
.ph::before{content:"";position:absolute;width:42%;aspect-ratio:1;border-radius:50%;background:var(--logo) center/cover;opacity:.35;filter:grayscale(1)}
.ph span{position:absolute;bottom:14px;font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

/* Categorias */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:1.5rem;min-height:128px;padding:1rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:2px;transition:background .2s,color .2s,transform .2s}
.tile:hover{background:var(--ink);color:var(--on-ink);transform:translateY(-3px)}
.tile{min-width:0}.tile .name{font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,5.6vw,1.7rem);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.tile .count{display:flex;justify-content:space-between;align-items:center;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile:hover .count{color:var(--sand)}
.tile svg{width:18px;height:18px}

/* Lojas */
.stores{display:grid;gap:1rem}
.store{display:grid;gap:1rem;align-content:start;padding:1.4rem;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:2px}
.store h3{font-size:2rem;font-weight:900}
.store dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;margin:0;font-size:.95rem}
.store dt{color:var(--on-ink-muted)}
.store dd{margin:0}
.hours{display:grid;gap:.25rem;font-size:.92rem;padding-top:.6rem;border-top:1px solid var(--ink-line)}
.hours div{display:flex;justify-content:space-between;gap:1rem}
.hours span:first-child{color:var(--on-ink-muted)}
.store .acts{display:flex;flex-wrap:wrap;gap:.6rem}
@media(min-width:760px){.stores{grid-template-columns:1fr 1fr}}
.social{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1rem}
.newsbox{padding:1.4rem;background:var(--surface);border:1px solid var(--line);max-width:60ch}
.newsbox h3{font-size:1.8rem;margin-bottom:.4rem}

/* Rodapé */
.ftr{background:#070708;color:var(--on-ink);padding-block:3rem 1.5rem}
.ftr-grid{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.ftr h4{font-size:1.15rem;letter-spacing:.1em;color:var(--sand);margin-bottom:.8rem}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:.45rem;font-size:.92rem;color:var(--on-ink-muted)}
.ftr li button{background:none;border:0;padding:0;color:inherit;text-align:left}
.ftr li button:hover,.ftr a:hover{color:var(--on-ink)}
.ftr .brand-ft{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.ftr .brand-ft img{width:64px;height:64px;border-radius:50%}
.ftr .small{font-size:.9rem;color:var(--on-ink-muted);max-width:34ch}
.ftr-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;margin-top:2.2rem;padding-top:1.2rem;border-top:1px solid var(--ink-line);font-size:.8rem;color:var(--on-ink-muted)}
.ftr-bottom button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px}

/* Catálogo */
.page{padding-block:2rem 4rem}
.crumbs{display:flex;gap:.5rem;flex-wrap:wrap;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem}
.crumbs button{background:none;border:0;padding:0;text-transform:uppercase;letter-spacing:.1em;font-size:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px}
.page h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:900}
.toolbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-block:1.2rem}
.search-f{position:relative;flex:1 1 260px}
.search-f input{width:100%;min-height:46px;padding:.6rem 2.6rem .6rem 2.6rem;border:2px solid var(--line);background:var(--surface);border-radius:2px}
.search-f input:focus{border-color:var(--fg);outline:none}
.search-f svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--muted)}
.search-f button{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:none;display:grid;place-items:center}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;padding:.4rem .9rem;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.04em}
.chip:hover{border-color:var(--fg)}
.chip.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.cat-layout{display:grid;gap:1.4rem;grid-template-columns:minmax(0,1fr)}
#results{min-width:0}
.filters{display:none;gap:1.1rem;align-content:start;padding:1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:2px}
.filters.open{display:grid}
.filters h4{font-size:1.4rem}
.field{display:grid;gap:.35rem;min-width:0}
.field>label,.field>.lbl{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp,.field select,.field input:not([type=checkbox]):not([type=radio]),.field textarea{width:100%;min-height:46px;padding:.6rem .8rem;border:1.5px solid var(--line);background:var(--surface);border-radius:2px}
.field textarea{min-height:96px;resize:vertical}
.inp:focus,.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--fg);outline:none}
.field.err input,.field.err select{border-color:var(--red)}
.field .msg{font-size:.78rem;color:var(--red);font-weight:600}
.price-r{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.check{display:flex;gap:.6rem;align-items:center;min-height:36px;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--btn-bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:1rem}
.cat-block{margin-bottom:3rem}
.cat-block .sec-head{margin-bottom:1rem}
.cat-block h2{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:900}
.empty{padding:2.5rem 1rem;text-align:center;border:1.5px dashed var(--line);display:grid;gap:.8rem;justify-items:center;color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--font-display);font-size:1.8rem;text-transform:uppercase}
.count-l{font-size:.85rem;color:var(--muted)}
@media(min-width:960px){.cat-layout{grid-template-columns:260px minmax(0,1fr)}.filters{display:grid;position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}.filt-toggle{display:none!important}}

/* Produto */
.pdp{display:grid;gap:2rem}
.gal{display:grid;gap:.7rem;min-width:0}
.gal-main{position:relative;aspect-ratio:4/5;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);padding:0;width:100%;cursor:zoom-in;border-radius:2px}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;opacity:.85}
.gal-nav.p{left:8px}.gal-nav.n{right:8px}
.gal-nav svg{width:20px;height:20px}
.thumbs{display:flex;gap:.5rem;overflow-x:auto}
.thumbs button{flex:0 0 68px;height:84px;padding:0;border:2px solid transparent;background:var(--surface-2);overflow:hidden;border-radius:2px}
.thumbs button.on{border-color:var(--fg)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{display:grid;gap:1.1rem;align-content:start;min-width:0}
.info h1{font-size:clamp(2.4rem,7vw,3.8rem);font-weight:900}
.info .price{font-family:var(--font-display);font-weight:800;font-size:2.1rem;line-height:1}
.info .price.ask{font-family:var(--font-body);font-weight:600;font-size:1rem;color:var(--muted)}
.desc{max-width:60ch;color:var(--muted)}
.size-grid{display:flex;flex-wrap:wrap;gap:.5rem}
.size-btn{min-width:54px;min-height:48px;padding:.4rem .8rem;border:2px solid var(--fg);background:transparent;font-weight:800;border-radius:2px}
.size-btn:hover{background:var(--surface-2)}
.size-btn.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.size-btn[disabled]{border-color:var(--line);color:var(--muted);text-decoration:line-through;cursor:not-allowed;background:transparent}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--fg);border-radius:2px}
.stepper button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.stepper button svg{width:18px;height:18px}
.stepper output{min-width:42px;text-align:center;font-weight:800}
.avail{display:inline-flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:700}
.avail i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.avail.out i{background:var(--red)}
.buy{display:grid;gap:.6rem;grid-template-columns:1fr}
.hint{padding:.7rem .9rem;border-left:4px solid var(--red);background:var(--surface);font-size:.9rem;font-weight:600}
@media(min-width:820px){.pdp{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:3rem}.buy{grid-template-columns:1fr 1fr}.gal{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));align-self:start}}

/* Gaveta do carrinho, busca, lightbox */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);z-index:90;display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-20px 0 50px -20px rgba(0,0,0,.5)}
.drawer.open{transform:none;visibility:visible;transition-delay:0s}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:1rem max(16px,env(safe-area-inset-right,0px)) 1rem 1.2rem;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:2rem;font-weight:900}
.drawer-b{flex:1;overflow-y:auto;padding:1rem max(16px,env(safe-area-inset-right,0px)) 1rem 1.2rem;display:grid;gap:1rem;align-content:start}
.drawer-f{padding:1rem max(16px,env(safe-area-inset-right,0px)) 1rem 1.2rem;border-top:1px solid var(--line);display:grid;gap:.6rem;background:var(--surface)}
.ci{display:grid;grid-template-columns:78px 1fr;gap:.8rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.ci-img{width:78px;height:98px;background:var(--surface-2);overflow:hidden;border-radius:2px}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-b{display:grid;gap:.4rem;min-width:0}
.ci-b h3{font-size:1.25rem;font-weight:800;line-height:1}
.ci-row{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;justify-content:space-between}
.ci select{min-height:36px;padding:.2rem .5rem;border:1.5px solid var(--line);background:var(--surface);border-radius:2px}
.ci .stepper button{width:34px;height:34px}
.ci .stepper{border-width:1.5px}
.tot{display:flex;justify-content:space-between;gap:1rem;font-weight:700}
.tot.big{font-family:var(--font-display);font-size:1.7rem;text-transform:uppercase}
.note{font-size:.82rem;color:var(--muted)}
.sres{position:fixed;inset:0;z-index:95;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sres.open{display:flex}
.sres-top{background:var(--ink);color:var(--on-ink)}
.sres-top .wrap{display:flex;gap:.6rem;align-items:center;min-height:68px}
.sres-top input{flex:1;min-width:0;min-height:48px;background:#1b1b1e;border:2px solid #36363a;color:var(--on-ink);padding:.5rem .9rem;border-radius:2px;font-size:1.05rem}
.sres-top input:focus{border-color:var(--sand);outline:none}
.sres-body{flex:1;overflow-y:auto;padding-block:1.2rem 2rem}
.sr-list{display:grid;gap:.6rem}
.sr-item{display:grid;grid-template-columns:56px 1fr auto;gap:.8rem;align-items:center;padding:.5rem;background:var(--surface);border:1px solid var(--line);text-align:left;border-radius:2px;width:100%}
.sr-item .t{width:56px;height:70px;background:var(--surface-2);overflow:hidden}
.sr-item .t img{width:100%;height:100%;object-fit:cover}
.sr-item h3{font-size:1.2rem;font-weight:800}
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,5,6,.95);display:none;place-items:center;padding:1rem}
.lb.open{display:grid}
.lb img{max-height:88vh;max-width:min(94vw,900px);width:auto;object-fit:contain}
.lb .x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--on-ink);padding:.8rem 1.2rem;border-radius:2px;border-left:4px solid var(--sand);font-weight:600;font-size:.9rem;z-index:120;opacity:0;pointer-events:none;transition:all .25s;max-width:min(92vw,420px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Checkout */
.steps{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin:.8rem 0 1.5rem;font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.steps .on{color:var(--fg);border-bottom:3px solid var(--fg);padding-bottom:2px}
.co{display:grid;gap:1.6rem;align-items:start}
.co-main{display:grid;gap:1.4rem;min-width:0}
.panel{padding:1.3rem;background:var(--surface);border:1px solid var(--line);border-radius:2px;display:grid;gap:1rem;min-width:0}
.panel h2{font-size:1.9rem;font-weight:900}
.opts{display:grid;gap:.7rem}
.opt{position:relative;display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start;padding:1rem;border:2px solid var(--line);background:var(--bg);border-radius:2px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--muted)}
.opt input{width:20px;height:20px;margin-top:3px;accent-color:var(--btn-bg)}
.opt:has(input:checked){border-color:var(--fg);background:var(--surface-2)}
.opt:has(input:focus-visible){outline:3px solid var(--slate);outline-offset:2px}
.opt b{font-family:var(--font-display);font-size:1.5rem;text-transform:uppercase;line-height:1}
.opt small{display:block;color:var(--muted);font-size:.86rem}
.opts.two{grid-template-columns:1fr}
.form-g{display:grid;align-items:start;gap:.9rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-g .full{grid-column:1/-1}
.co-side{display:grid;gap:1rem;min-width:0}
.mini{display:grid;grid-template-columns:52px 1fr auto;gap:.7rem;align-items:center;font-size:.9rem}
.mini .t{width:52px;height:64px;background:var(--surface-2);overflow:hidden}

.alert{padding:.9rem 1rem;border-left:4px solid var(--red);background:var(--surface);font-weight:600;font-size:.92rem}

@media(min-width:520px){.opts.two{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.co{grid-template-columns:minmax(0,1fr) 360px}.co-side{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}}
@media(max-width:480px){.form-g{grid-template-columns:1fr}.form-g .half{grid-column:1/-1}}
.sum-table{display:grid;gap:.8rem}
.sum-row{display:grid;grid-template-columns:64px 1fr;gap:.8rem;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.sum-row .t{width:64px;height:80px;background:var(--surface-2);overflow:hidden}
.sum-row .t img{width:100%;height:100%;object-fit:cover}
.sum-row h3{font-size:1.3rem;font-weight:800;line-height:1}
.kv{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:.35rem 1rem;margin:0}
.kv dt{color:var(--muted);font-size:.88rem}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.msg-prev{white-space:pre-wrap;font-size:.84rem;background:var(--bg);border:1px solid var(--line);padding:1rem;max-height:340px;overflow:auto;overflow-wrap:anywhere}
.sum-actions{display:grid;gap:.7rem}
@media(min-width:640px){.sum-actions{grid-template-columns:1fr 2fr}}

/* Admin */
.adm-login{max-width:420px;margin:3rem auto;display:grid;gap:1rem}
.adm-bar{position:sticky;bottom:0;z-index:30;background:var(--ink);color:var(--on-ink);border-top:3px solid var(--sand);padding-block:.8rem calc(.8rem + env(safe-area-inset-bottom,0px))}
.adm-bar .wrap{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--line);margin-block:1.2rem;overflow-x:auto}
.tab{flex:0 0 auto;background:none;border:0;padding:.7rem 1rem;font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--fg);border-color:var(--fg)}
.alist{display:grid;gap:.6rem}
.arow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:.8rem;padding:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:2px;align-items:center}
.arow .t{width:56px;height:70px;background:var(--surface-2);overflow:hidden}
.arow .t img{width:100%;height:100%;object-fit:cover}
.arow h3{font-size:1.25rem;font-weight:800;line-height:1}
.arow .meta{font-size:.8rem;color:var(--muted)}
.arow .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem}
.tg{min-height:34px;padding:.2rem .7rem;border:1.5px solid var(--line);background:transparent;border-radius:999px;font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.tg.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.modal{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.6);display:none;overflow-y:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.modal.open{display:block}
.modal-in{max-width:760px;margin:0 auto;background:var(--bg);padding:1.3rem;border-radius:2px;display:grid;gap:1.1rem}
.modal-in>h2{font-size:2.2rem;font-weight:900}
.img-edit{display:flex;flex-wrap:wrap;gap:.6rem}
.img-edit .im{position:relative;width:88px;height:110px;background:var(--surface-2);overflow:hidden;border:2px solid var(--line)}
.img-edit .im.first{border-color:var(--fg)}
.img-edit img{width:100%;height:100%;object-fit:cover}
.img-edit .im .x{position:absolute;top:2px;right:2px;width:26px;height:26px;border:0;background:var(--ink);color:#fff;border-radius:50%;font-size:.8rem}
.img-edit .im .mk{position:absolute;bottom:0;left:0;right:0;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.08em;padding:3px;text-transform:uppercase}
.sz-edit{display:grid;gap:.4rem}
.sz-row{display:grid;grid-template-columns:minmax(60px,1fr) auto 110px auto;gap:.6rem;align-items:center;padding:.4rem .6rem;border:1px solid var(--line);background:var(--surface)}
.sz-row input[type=text],.sz-row input[type=number]{min-height:38px;padding:.3rem .5rem;border:1.5px solid var(--line);background:var(--bg);width:100%;border-radius:2px}
.sz-row label{display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:700}
.sz-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--btn-bg)}
.cat-row{display:grid;gap:.7rem;padding:1rem;background:var(--surface);border:1px solid var(--line);grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.cat-row .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.pub-msg{font-size:.88rem;font-weight:600}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.notice{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
@media(max-width:480px){.sz-row{grid-template-columns:1fr 1fr;}.sz-row .btn{justify-self:end}}
</style>

    C('moletons','Moletons','roupa',['Com capuz','Sem capuz','Oversized','Blusas de frio']),
    C('bermudas','Bermudas','numerica',['Jeans','Cargo','Esportivas']),
    C('shorts','Shorts','roupa',['Femininos','Masculinos']),

  const sz=(set,off=[])=>SIZESETS[set].sizes.map(l=>({l,on:!off.includes(l),stock:null}));
  const ex=(id,name,cat,type,set,o={})=>({id,name:'Exemplo · '+name,cat,type,desc:'Produto de exemplo para mostrar como o catálogo fica. Cadastre a peça real, com foto, preço e tamanhos, na área administrativa.',price:null,images:[],sizes:sz(set,o.off||[]).filter(s=>!o.only||o.only.includes(s.l)),featured:!!o.f,isNew:!!o.n,active:true,demo:true,at:o.at||0});
  const products=[
    ex('ex1','Camiseta básica','camisetas','Básicas','roupa',{n:1,f:1,at:12,off:['PP','XG']}),
    ex('ex2','Camiseta oversized','camisetas','Oversized','roupa',{n:1,at:11,off:['PP','GG']}),
    ex('ex3','Conjunto casual','conjuntos','Casuais','roupa',{n:1,f:1,at:10,off:['XG']}),
    ex('ex4','Conjunto esportivo','conjuntos','Esportivos','roupa',{n:1,at:9}),
    ex('ex5','Tênis casual','tenis','Casuais','tenis',{n:1,f:1,at:8,only:['38','39','40','41','42','43'],off:['39']}),
    ex('ex6','Tênis esportivo','tenis','Esportivos','tenis',{at:7,only:['37','38','39','40','41','42','43','44']}),
    ex('ex7','Calça jogger','calcas','Jogger','numerica',{n:1,at:6,off:['46']}),
    ex('ex8','Calça cargo','calcas','Cargo','numerica',{f:1,at:5}),
    ex('ex9','Moletom com capuz','moletons','Com capuz','roupa',{at:4,off:['PP']}),
    ex('ex10','Moletom oversized','moletons','Oversized','roupa',{f:1,at:3}),
    ex('ex11','Bermuda cargo','bermudas','Cargo','numerica',{at:2}),
    ex('ex12','Jaqueta','jaquetas','Jaquetas','roupa',{at:1,off:['PP','P','M','G','GG','XG']})
  ];
  return Object.assign({logo:'',categories,products,social:{instagram:'',facebook:''},shipping:null,news:{title:'',text:''},passHash:''},base||{});
}
function normalize(raw){
  let s=(raw&&raw.categories&&raw.products)?raw:seed(raw);
  s.social=s.social||{instagram:'',facebook:''};
  s.news=s.news||{title:'',text:''};
  if(typeof s.shipping!=='number')s.shipping=null;
  s.products.forEach(p=>{p.images=p.images||[];p.sizes=p.sizes||[];p.at=p.at||0;});
  return s;
}

/* ========= carrinho ========= */
function cartLines(){
  return cart.map(it=>{const p=prod(it.pid);if(!p)return null;const so=(p.sizes||[]).find(s=>s.l===it.size);return{it,p,so,unit:priceOf(p),ok:!!(so&&sizeOk(so)&&p.active!==false)}}).filter(Boolean);
}
function cartCount(){return cartLines().reduce((a,l)=>a+l.it.qty,0)}
function addToCart(pid,size,qty){
  const p=prod(pid);if(!p)return;
  let it=cart.find(x=>x.pid===pid&&x.size===size);
  if(it)it.qty=Math.min(it.qty+qty,maxQty(p,size));else cart.push({pid,size,qty:Math.min(qty,maxQty(p,size))});
  saveCart();updateBadge();renderDrawer();
}
function totals(){
  const L=cartLines();
  const allPriced=L.length>0&&L.every(l=>l.unit!==null);
  const sub=L.reduce((a,l)=>a+(l.unit!==null?l.unit*l.it.qty:0),0);
  const ship=typeof S.shipping==='number'?S.shipping:null;
  return{L,allPriced,sub,ship,
    subText:allPriced?money(sub):'Valor a confirmar pelo atendimento',
    shipText:ship!==null?money(ship):'Frete a confirmar pelo atendimento.',
    totalText:allPriced?(ship!==null?money(sub+ship):money(sub)+' + frete a confirmar'):'Valor a confirmar pelo atendimento'};
}

/* ========= CATÁLOGO ========= */
function matches(p,q){
  const words=norm(q).split(/\s+/).filter(Boolean);if(!words.length)return true;
  const hay=norm([p.name,catName(p),p.type,p.desc].join(' '));
  const sizes=(p.sizes||[]).filter(sizeOk).map(s=>norm(s.l));
  return words.every(w=>hay.includes(w)||sizes.includes(w));
}
function filtered(){
  return S.products.filter(p=>{
    if(p.active===false)return false;
    if(F.cat&&p.cat!==F.cat)return false;
    if(F.type&&p.type!==F.type)return false;
    if(F.size&&!availSizes(p).some(s=>s.l===F.size))return false;
    if(F.avail&&!isAvail(p))return false;
    const pr=priceOf(p),mn=parseFloat(String(F.min).replace(',','.')),mx=parseFloat(String(F.max).replace(',','.'));
    if(!isNaN(mn)||!isNaN(mx)){if(pr===null)return false;if(!isNaN(mn)&&pr<mn)return false;if(!isNaN(mx)&&pr>mx)return false}
    if(F.q&&!matches(p,F.q))return false;
    return true;
  }).sort(sortNew);
}
const isFiltering=()=>!!(F.cat||F.type||F.size||F.avail||F.min||F.max||F.q);
function viewCatalog(){
  const c=cat(F.cat);
  const chips='<div class="chips" role="group" aria-label="Categorias"><button class="chip'+(F.cat?'':' on')+'" data-act="setCat" data-cat="">Todas</button>'+S.categories.map(x=>'<button class="chip'+(F.cat===x.id?' on':'')+'" data-act="setCat" data-cat="'+x.id+'">'+esc(x.name)+'</button>').join('')+'</div>';
  return '<div class="wrap page"><nav class="crumbs" aria-label="Você está em"><button data-go="home">Início</button><span>/</span><span>Catálogo</span>'+(c?'<span>/</span><span>'+esc(c.name)+'</span>':'')+'</nav>'+
   '<h1>'+(c?esc(c.name):'Catálogo')+'</h1>'+

function validateCk(){
  const E={},T=totals();
  if(!ck.pay)E.pay='Escolha PIX ou cartão.';
  if(!ck.name||ck.name.trim().length<3)E.name='Informe seu nome completo.';
  const ph=(ck.phone||'').replace(/\D/g,'');if(ph.length<10||ph.length>11)E.phone='Informe um telefone com DDD.';
  if((ck.cep||'').replace(/\D/g,'').length!==8)E.cep='Informe o CEP com 8 números.';
  if(!ck.uf)E.uf='Selecione o estado.';
  if(!(ck.city||'').trim())E.city='Informe a cidade.';
  if(!(ck.bairro||'').trim())E.bairro='Informe o bairro.';
  if(!(ck.street||'').trim())E.street='Informe a rua ou avenida.';
  if(!(ck.num||'').trim())E.num='Informe o número.';
  if(!ck.unit)E.unit='Escolha a unidade.';
  if(!T.L.length)E.cart='Carrinho vazio.';
  if(T.L.some(l=>!l.ok||!l.it.size||l.it.qty<1))E.cart='Há peças indisponíveis no carrinho.';
  return E;
}
function maskPhone(v){const d=v.replace(/\D/g,'').slice(0,11);if(d.length<=2)return d?'('+d:'';if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7)}
function maskCep(v){const d=v.replace(/\D/g,'').slice(0,8);return d.length>5?d.slice(0,5)+'-'+d.slice(5):d}
async function lookupCep(cep){
  const note=$('#cep-note');
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),4500);
    const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/',{signal:ctl.signal});clearTimeout(to);
    const d=await r.json();
    if(d&&!d.erro){
      ck.uf=d.uf||ck.uf;ck.city=d.localidade||ck.city;if(d.bairro)ck.bairro=d.bairro;if(d.logradouro)ck.street=d.logradouro;saveCk();
      ['uf','city','bairro','street'].forEach(k=>{const el=$('#ck-'+k);if(el)el.value=ck[k]||''});
      if(note)note.textContent='Endereço preenchido pelo CEP. Confira e complete o número.';
      return;
    }
    if(note)note.textContent='CEP não encontrado. Preencha o endereço manualmente.';
  }catch(e){if(note)note.textContent='Não foi possível buscar o CEP agora. Preencha o endereço manualmente.'}
}

/* ========= carrosséis ========= */
function initCarousels(){
  $$('[data-car]').forEach(car=>{
    const tr=$('.car-track',car),bar=$('.car-bar i',car);
    const upd=()=>{
      const max=tr.scrollWidth-tr.clientWidth;
      car.classList.toggle('no-scroll',max<4);
      car.classList.toggle('can-prev',tr.scrollLeft>4);
      car.classList.toggle('can-next',tr.scrollLeft<max-4);
      const w=Math.max(12,Math.min(100,tr.clientWidth/tr.scrollWidth*100));
      bar.style.width=w+'%';bar.style.marginLeft=(max>0?(tr.scrollLeft/max)*(100-w):0)+'%';
    };
    tr.addEventListener('scroll',upd,{passive:true});
    let sx=0,sl=0,moved=false;
    const mv=e=>{const dx=e.clientX-sx;if(Math.abs(dx)>5&&!moved){moved=true;tr.classList.add('dragging')}if(moved)tr.scrollLeft=sl-dx};
    const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);setTimeout(()=>{tr.classList.remove('dragging');moved=false},0)};
    tr.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;moved=false;sx=e.clientX;sl=tr.scrollLeft;window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)});
    tr.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault()}},true);
    tr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){tr.scrollBy({left:260,behavior:'smooth'})}if(e.key==='ArrowLeft'){tr.scrollBy({left:-260,behavior:'smooth'})}});
    upd();setTimeout(upd,300);
  });
}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}}

function shrink(file,max=1100,q=.82){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};im.onerror=()=>rej(new Error('img'));im.src=url})}
async function storeImage(blob){
  try{const A=(window.claude&&claude.use)?await claude.use('assets'):null;if(A){const r=await A.upload(blob);if(r&&r.url)return r.url}}catch(e){}
  return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
}
function parseMoney(v){const s=String(v||'').replace(/[^\d,.]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)||n<=0?null:Math.round(n*100)/100}

async function publish(){
  const msg=t=>{pubMsg=t;const el=$('#pubmsg');if(el)el.textContent=t};
  if(isStandalone()){
    try{
      const blob=new Blob([standaloneDoc()],{type:'text/html'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();
      msg('index.html baixado. Envie esse arquivo ao Netlify para atualizar o site.');
    }catch(e){msg('Não foi possível gerar o arquivo agora. Tente de novo.')}
    return;
  }
  let A=null;try{A=(window.claude&&claude.use)?await claude.use('artifact'):null}catch(e){}
  if(!A){msg('Publicação indisponível aqui. Abra o site pelo link da sua conta no Claude para publicar.');return}
  msg('Publicando…');
  try{
    const reset=(document.head.querySelector('style')||{}).textContent||'';
    const css=$('#bps-style').textContent,code=$('#bps-code').textContent;
    const data=JSON.stringify(exportState()).replace(/</g,'\\u003c');
    const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+(/safe-area/.test(reset)?reset:FALLBACK_RESET)+'</style></head><body>'+HEAD+'<style id="bps-style">'+css+'</style><div id="app"></div><script type="application/json" id="bps-data">'+data+'<\/script><script id="bps-code">'+code+'<\/script></body></html>';
    ss.set('bps-view','admin');ss.set('bps-adm','1');
    await A.publish(html);
    dirty=false;ls.del('bps-draft');msg('Publicado. O site já está atualizado.');
  }catch(e){
    const c=e&&e.code;
    msg(c==='not_writer'||c==='not_granted'||c==='capability_disabled'?'Sua conta não tem permissão para publicar. Entre no Claude com a conta dona do site.':c==='conflict'?'Outra versão foi publicada. A página vai recarregar com a versão nova.':c==='too_large'?'O site ficou grande demais. Use fotos menores.':c==='rate_limited'?'Muitas publicações seguidas. Espere um instante.':'Não foi possível publicar agora. Tente de novo.');
  }
}

/* ========= eventos ========= */
const ACT={
  openCart:()=>openDrawer(),
  closeAll:()=>closeOverlays(),
  openSearch:()=>openSearch(),
  toggleMenu:t=>{const m=$('#mmenu'),o=m.classList.toggle('open');t.setAttribute('aria-expanded',o)},
  setCat:t=>{F.cat=t.dataset.cat||'';F.type='';F.size='';renderMain();window.scrollTo({top:0,behavior:'smooth'})},
  setSize:t=>{F.size=F.size===t.dataset.size?'':t.dataset.size;refreshCatalog(true)},
  clearQ:()=>{F.q='';refreshCatalog(true)},
  clearFilters:()=>{F=Object.assign(defF(),{open:F.open});refreshCatalog(true)},
  toggleFilters:()=>{F.open=!F.open;$('#filters').classList.toggle('open',F.open)},
  quickSearch:t=>{const i=$('#sq');i.value=t.dataset.q;searchRender(t.dataset.q);i.focus()},
  clearSearch:()=>{const i=$('#sq');i.value='';searchRender('');i.focus()},
  zoom:()=>{const p=prod(PV.id);if(!p||!p.images.length)return;const lb=$('#lb');lb.innerHTML='<button class="icon-btn x" data-act="closeAll" aria-label="Fechar">'+I.x+'</button><img src="'+esc(p.images[PV.img]||p.images[0])+'" alt="'+esc(p.name)+'">';lb.classList.add('open')},
  galPrev:(t,e)=>{e.stopPropagation();const p=prod(PV.id);PV.img=(PV.img-1+p.images.length)%p.images.length;refreshProduct(true)},
  galNext:(t,e)=>{e.stopPropagation();const p=prod(PV.id);PV.img=(PV.img+1)%p.images.length;refreshProduct(true)},
  galSet:t=>{PV.img=+t.dataset.i;refreshProduct(true)},
  pickSize:t=>{PV.size=t.dataset.size;PV.hint=false;refreshProduct(true)},
  qty:t=>{const p=prod(PV.id),mq=PV.size?maxQty(p,PV.size):99;PV.qty=Math.max(1,Math.min(mq,PV.qty+ +t.dataset.d));refreshProduct(true)},
  addCart:()=>{if(!needSize())return;addToCart(PV.id,PV.size,PV.qty);toast('Adicionado ao carrinho');openDrawer()},
  buyNow:()=>{if(!needSize())return;addToCart(PV.id,PV.size,PV.qty);go('checkout')},
  cartQty:t=>{const it=cart.find(x=>x.pid===t.dataset.pid&&x.size===t.dataset.size);if(!it)return;const p=prod(it.pid);it.qty=Math.max(1,Math.min(maxQty(p,it.size),it.qty+ +t.dataset.d));saveCart();updateBadge();renderDrawer();if(V.name==='checkout')renderMain()},
  cartDel:t=>{cart=cart.filter(x=>!(x.pid===t.dataset.pid&&x.size===t.dataset.size));saveCart();updateBadge();renderDrawer();if(V.name==='checkout')renderMain()},
  toSummary:()=>{const E=validateCk();CT=E;if(Object.keys(E).length){renderMain();const first=$('.field.err input,.field.err select')||$('#sec-pay');if(first){first.scrollIntoView({behavior:'smooth',block:'center'});if(first.focus)first.focus({preventScroll:true})}return}CT=null;go('summary')},
  waClick:(t,e)=>{const E=validateCk();if(Object.keys(E).length){e.preventDefault();go('checkout');return}const a=$('#wa-after');if(a)a.innerHTML='<p class="alert ok" role="status">A mensagem do pedido foi preparada no WhatsApp. Envie para a loja confirmar disponibilidade, valor e frete. Se o WhatsApp não abriu, use “Copiar mensagem do pedido”.</p><button class="btn ghost block" data-act="clearCart" style="margin-top:.6rem">Já enviei: limpar carrinho</button>'},
  clearCart:()=>{cart=[];saveCart();updateBadge();toast('Carrinho limpo');go('home')},
  copyMsg:async()=>{const m=buildMessage();try{await navigator.clipboard.writeText(m);toast('Mensagem copiada')}catch(e){const d=$('details.panel');if(d)d.open=true;toast('Selecione e copie a mensagem abaixo')}},
  /* admin */
  admLogin:async()=>{const v=$('#adm-pass').value;const h=await sha(v);const ok=h===(S.passHash||await sha(DEFAULT_PASS));if(ok){ADM.authed=true;ADM.err='';ADM.draftOffer=true;ss.set('bps-adm','1')}else ADM.err='Senha incorreta.';renderMain()},
  admLogout:()=>{ADM.authed=false;ss.del('bps-adm');go('home')},
  admTab:t=>{ADM.tab=t.dataset.tab;ADM.msg='';renderMain()},
  admToggle:t=>{const p=prod(t.dataset.id),k=t.dataset.k;p[k]=k==='active'?!(p.active!==false):!p[k];markDirty();renderMain()},
  admNew:()=>openForm(null),
  admEdit:t=>openForm(prod(t.dataset.id)),
  admRemoveDemo:()=>{S.products=S.products.filter(p=>!p.demo);markDirty();renderMain()},
  restoreDraft:()=>{try{S=normalize(JSON.parse(ls.get('bps-draft')));dirty=true;ADM.draftOffer=false;renderHeader();renderFooter();renderMain()}catch(e){}},
  dropDraft:()=>{ls.del('bps-draft');ADM.draftOffer=false;renderMain()},
  discard:()=>{ls.del('bps-draft');location.reload()},
  publish:()=>publish(),
  catUp:t=>moveCat(t.dataset.id,-1),catDown:t=>moveCat(t.dataset.id,1),
  catDel:t=>{const id=t.dataset.id;if(S.products.some(p=>p.cat===id)){ADM.msg='Esta categoria ainda tem produtos. Mova ou exclua os produtos antes.';renderMain();return}S.categories=S.categories.filter(c=>c.id!==id);ADM.msg='';markDirty();renderMain()},
  catAdd:()=>{const n=$('#nc-name').value.trim();if(!n){ADM.msg='Digite o nome da categoria.';renderMain();return}let id=norm(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid();while(cat(id))id+='-'+Math.floor(Math.random()*90+10);S.categories.push({id,name:n,sizeSet:$('#nc-set').value,types:[]});ADM.msg='';markDirty();renderMain()},
  savePass:async()=>{const v=$('#st-pw').value;if(v.length<6){ADM.passMsg='Use ao menos 6 caracteres.';renderMain();return}S.passHash=await sha(v);ADM.passMsg='Senha atualizada. Gere o arquivo atualizado para valer no site.';markDirty();renderMain()},
  /* formulário */
  afCancel:()=>closeForm(),
  afPreset:()=>{AF.p.sizes=presetSizes($('#af-preset').value);renderForm()},
  afSzAdd:()=>{AF.p.sizes.push({l:'',on:true,stock:null});renderForm()},
  afSzDel:t=>{AF.p.sizes.splice(+t.dataset.i,1);renderForm()},
  afImgDel:t=>{AF.p.images.splice(+t.dataset.i,1);renderForm()},
  afImgMain:t=>{const i=+t.dataset.i,u=AF.p.images.splice(i,1)[0];AF.p.images.unshift(u);renderForm()},
  afDel:()=>{AF.confirmDel=true;renderForm()},
  afDelYes:()=>{S.products=S.products.filter(p=>p.id!==AF.p.id);cart=cart.filter(x=>x.pid!==AF.p.id);saveCart();markDirty();closeForm();renderMain();updateBadge()},
  afSave:()=>{
    const p=AF.p;p.name=p.name.trim();
    if(!p.name){AF.err='Informe o nome do produto.';renderForm();return}
    if(!p.cat){AF.err='Escolha a categoria.';renderForm();return}
    p.sizes=p.sizes.filter(s=>String(s.l).trim()).map(s=>({l:String(s.l).trim(),on:s.on!==false,stock:typeof s.stock==='number'?s.stock:null}));
    const seen={};for(const s of p.sizes){if(seen[s.l]){AF.err='Tamanho repetido: '+s.l;renderForm();return}seen[s.l]=1}
    const i=S.products.findIndex(x=>x.id===p.id);
    if(i>=0){p.demo=S.products[i].demo&&p.name===S.products[i].name?S.products[i].demo:false;S.products[i]=p}else S.products.push(p);
    markDirty();closeForm();renderMain();toast('Produto salvo. Baixe/publique para aparecer no site.');
  }
};
function moveCat(id,d){const i=S.categories.findIndex(c=>c.id===id),j=i+d;if(j<0||j>=S.categories.length)return;const a=S.categories;[a[i],a[j]]=[a[j],a[i]];markDirty();renderMain()}

function onClick(e){
  const car=e.target.closest('[data-car-dir]');
  if(car){const tr=$('.car-track',car.closest('[data-car]'));tr.scrollBy({left:+car.dataset.carDir*Math.max(tr.clientWidth*.8,240),behavior:'smooth'});return}
  const sc=e.target.closest('[data-scroll]');
  if(sc){goSection(sc.dataset.scroll);return}
  const el=e.target.closest('[data-act],[data-go]');
  if(!el||el.disabled)return;
  if(el.dataset.act&&ACT[el.dataset.act]){ACT[el.dataset.act](el,e);return}
  if(el.dataset.go){const d=el.dataset;go(d.go,{id:d.id,cat:d.cat,q:d.q,buy:d.buy})}
}
function onInput(e){
  const t=e.target;
  if(t.dataset.ck!==undefined){
    const k=t.dataset.ck;
    if(k==='phone')t.value=maskPhone(t.value);
    if(k==='cep')t.value=maskCep(t.value);
    ck[k]=t.value;saveCk();
    if(CT&&CT[k]){delete CT[k];const f=t.closest('.field');if(f){f.classList.remove('err');const m=$('.msg',f);if(m)m.remove()}}
    if(k==='cep'&&t.value.replace(/\D/g,'').length===8)lookupCep(t.value.replace(/\D/g,''));
    return;
  }
  const b=t.dataset.bind;
  if(b==='q'){F.q=t.value;refreshCatalog(false);const f=t.closest('.search-f');let x=$('button',f);if(F.q&&!x){f.insertAdjacentHTML('beforeend','<button data-act="clearQ" aria-label="Limpar pesquisa">'+I.x+'</button>')}else if(!F.q&&x)x.remove();return}
  if(b==='min'||b==='max'){F[b]=t.value;refreshCatalog(false);return}
  if(b==='admq'){ADM.q=t.value;$('#alist').innerHTML=admListHtml();return}
  if(t.dataset.af!==undefined&&AF){
    const k=t.dataset.af;
    if(t.type==='checkbox')AF.p[k]=t.checked;
    else if(k==='price')AF.p.price=parseMoney(t.value);
    else AF.p[k]=t.value;
    return;
  }
  if(t.dataset.sz!==undefined&&AF){
    const s=AF.p.sizes[+t.dataset.sz],k=t.dataset.szk;
    if(k==='on')s.on=t.checked;else if(k==='stock')s.stock=t.value===''?null:Math.max(0,parseInt(t.value,10)||0);else s.l=t.value;
    return;
  }
  if(t.dataset.cf!==undefined){
    const id=t.closest('[data-cid]').dataset.cid,c=cat(id),k=t.dataset.cf;
    if(k==='types')c.types=t.value.split(',').map(x=>x.trim()).filter(Boolean);else c[k]=t.value;
    markDirty();return;
  }
  if(t.dataset.sf!==undefined){
    const k=t.dataset.sf;
    if(k==='instagram'||k==='facebook')S.social[k]=t.value.trim();
    else if(k==='shipping'){S.shipping=parseMoney(t.value)}
    else if(k==='newsTitle')S.news.title=t.value;else if(k==='newsText')S.news.text=t.value;
    markDirty();const m=$('#pubmsg');if(m)m.textContent='Há alterações que ainda não estão no site.';
    const bt=$$('.adm-bar .btn');bt.forEach(x=>x.disabled=false);
    return;
  }
}
function onChange(e){
  const t=e.target;
  if(t.dataset.ck!==undefined&&(t.type==='radio'||t.tagName==='SELECT')){
    ck[t.dataset.ck]=t.value;saveCk();
    if(CT&&CT[t.dataset.ck]){delete CT[t.dataset.ck];const f=t.closest('.field');if(f){f.classList.remove('err');const m=$('.msg',f);if(m)m.remove()}}
    return;
  }
  const b=t.dataset.bind;
  if(b==='cat'){F.cat=t.value;F.type='';F.size='';refreshCatalog(true);return}
  if(b==='type'){F.type=t.value;refreshCatalog(true);return}
  if(b==='avail'){F.avail=t.checked;refreshCatalog(true);return}
  if(t.dataset.actChange==='cartSize'){
    const it=cart.find(x=>x.pid===t.dataset.pid&&x.size===t.dataset.size);if(!it)return;
    const ns=t.value,dup=cart.find(x=>x!==it&&x.pid===it.pid&&x.size===ns);
    const p=prod(it.pid);
    if(dup){dup.qty=Math.min(dup.qty+it.qty,maxQty(p,ns));cart=cart.filter(x=>x!==it)}else{it.size=ns;it.qty=Math.min(it.qty,maxQty(p,ns))}
    saveCart();renderDrawer();if(V.name==='checkout')renderMain();return;
  }
  if(t.id==='af-cat'&&AF){AF.p.cat=t.value;const c=cat(t.value);if(AF.isNew||confirmPreset())AF.p.sizes=presetSizes(c?c.sizeSet:'roupa');AF.p.type='';renderForm();return}
  if(t.id==='af-files'&&AF){addFiles(t.files);return}
  if(t.dataset.af==='cat'&&AF){return}
  if(t.dataset.cf!==undefined){renderMain()}
}
function confirmPreset(){return false}
async function addFiles(files){
  const msg=$('#af-upmsg');if(msg)msg.textContent='Enviando fotos…';
  for(const f of Array.from(files)){
    try{const b=await shrink(f);const u=await storeImage(b);AF.p.images.push(u)}catch(e){}
  }
  renderForm();
}
function onKey(e){
  if(e.key==='Escape'){if(AF){closeForm();return}closeOverlays()}
  if(e.key==='Enter'&&e.target.id==='adm-pass'){ACT.admLogin()}
}

/* ========= início ========= */
function init(){
  let raw={};try{raw=JSON.parse($('#bps-data').textContent||'{}')}catch(e){}
  S=normalize(raw);
  document.documentElement.style.setProperty('--logo','url("'+S.logo+'")');
  try{cart=JSON.parse(ls.get('bps-cart')||'[]')}catch(e){cart=[]}
  try{ck=JSON.parse(ls.get('bps-ck')||'{}')}catch(e){ck={}}
  if(!Array.isArray(cart))cart=[];
  cart=cart.filter(x=>x&&prod(x.pid));
  $('#app').innerHTML='<header class="hdr" id="hdr"></header><main id="main"></main><footer class="ftr" id="ftr"></footer><div class="scrim" id="scrim" data-act="closeAll"></div><aside class="drawer" id="drawer" aria-label="Carrinho"></aside><div class="sres" id="sres" role="dialog" aria-label="Busca"></div><div class="lb" id="lb" data-act="closeAll"></div><div class="modal" id="modal"></div><div class="toast" id="toast" role="status"></div>';
  renderHeader();renderFooter();
  if(ss.get('bps-adm')==='1'){ADM.authed=true;ADM.draftOffer=true}
  if(ss.get('bps-view')==='admin')V={name:'admin'};
  if(ADM.authed&&V.name==='admin'){}
  renderMain();renderDrawer();
  const app=$('#app');
  app.addEventListener('click',onClick);
  app.addEventListener('input',onInput);
  app.addEventListener('change',onChange);
  document.addEventListener('keydown',onKey);
  window.addEventListener('beforeunload',()=>{});
}
init();
})();
